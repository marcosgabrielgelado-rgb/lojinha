services:
  - type: web
    name: magrao-imports
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 2 --threads 4 --timeout 90
    healthCheckPath: /health
    disk:
      name: magrao-imports-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_PATH
        value: /var/data/magrao.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "1"
